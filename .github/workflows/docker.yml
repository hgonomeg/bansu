name: Build Bansu Fedora image

# Builds and tests the image on every push that touches the Docker inputs (any
# branch), then pushes the *tested* image to Docker Hub on `aardvark`.
# Push-only (no pull_request trigger) so a commit never builds twice in parallel.
on:
  push:
    paths:
      - docker/FedoraDockerfile
      - docker/setup_bansu_fedora_image.sh
      - docker/wrappers/**
      - .github/workflows/docker.yml
  workflow_dispatch:

# # A newer push to the same branch supersedes an in-flight run.
# concurrency:
#   group: docker-${{ github.ref }}
#   cancel-in-progress: true

env:
  IMAGE: quicillith/bansu_fedora

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    # The image compiles RDKit/gemmi/acedrg/etc. from source; give it room.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # RDKit + all source trees can exceed the runner's Docker partition.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Context is docker/ because the Dockerfile COPYs wrappers/ and the setup script.
      # load: true puts the image in the local daemon so we test (and push) these exact bytes.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/FedoraDockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image contents
        run: |
          docker run --rm "$IMAGE:latest" bash -euo pipefail -c '
            echo "== RDKit =="
            python3 -c "import rdkit; print(rdkit.rdBase.rdkitVersion)"

            echo "== gemmi =="
            python3 -c "import gemmi; print(gemmi.__version__)"

            echo "== servalcat =="
            python3 -m servalcat --help >/dev/null

            echo "== monomer library =="
            test -d /usr/share/monomers

            echo "== aardvark data =="
            test -s /usr/share/aardvark/cod.sqlite

            echo "== acedrg =="
            command -v acedrg
            acedrg -h >/dev/null 2>&1 || echo "acedrg -h returned non-zero (review if unexpected)"

            echo "== aardvark =="
            # TODO: replace with a strict assertion once the installed binary name is confirmed.
            ls -1 /usr/bin | grep -i aardvark || echo "no /usr/bin/*aardvark* found — adjust this check"

            echo "== chapi (coot headless api) =="
            python3 -c "import coot_headless_api; print(coot_headless_api.__file__)"

            echo "All checks passed."
          '

      # --- Publish the tested image to Docker Hub (aardvark pushes only) -----------
      # Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/atman'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/atman'
        run: |
          docker push "$IMAGE:latest"
