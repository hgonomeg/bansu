name: Build Bansu Fedora image

# Runs whenever the Docker build inputs change. Build + test only for now;
# Docker Hub publishing is prepared but disabled (see the commented block below).
on:
  push:
    paths:
      - docker/FedoraDockerfile
      - docker/setup_bansu_fedora_image.sh
      - docker/wrappers/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - docker/FedoraDockerfile
      - docker/setup_bansu_fedora_image.sh
      - docker/wrappers/**
      - .github/workflows/docker.yml
  workflow_dispatch:

# A newer run for the same ref supersedes an in-flight one.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The image compiles RDKit/gemmi/acedrg/etc. from source; give it room.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # RDKit + all source trees can exceed the runner's Docker partition.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Context is docker/ because the Dockerfile COPYs wrappers/ and the setup script.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/FedoraDockerfile
          load: true
          push: false
          tags: bansu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image contents
        run: |
          docker run --rm bansu:ci bash -euo pipefail -c '
            echo "== RDKit =="
            python3 -c "import rdkit; print(rdkit.rdBase.rdkitVersion)"

            echo "== gemmi =="
            python3 -c "import gemmi; print(gemmi.__version__)"

            echo "== servalcat =="
            python3 -m servalcat --help >/dev/null

            echo "== monomer library =="
            test -d /usr/share/monomers

            echo "== acedrg =="
            command -v acedrg
            acedrg -h >/dev/null 2>&1 || echo "acedrg -h returned non-zero (review if unexpected)"

            echo "== atman =="
            # TODO: replace with a strict assertion once the installed binary name is confirmed.
            ls -1 /usr/bin | grep -i atman || echo "no /usr/bin/*atman* found — adjust this check"

            echo "All checks passed."
          '

  # --- Publish to Docker Hub (enable after creating the account) ---------------
  # 1. Create repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token,
  #    not your password) under Settings > Secrets and variables > Actions.
  # 2. Set IMAGE below to <namespace>/<repo> (e.g. hgonomeg/bansu).
